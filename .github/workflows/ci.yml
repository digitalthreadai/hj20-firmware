# HJ-20 firmware CI.
#
# One workflow, so every run carries everything the PLM reads from it:
#   artifact `junit-results`  -> junit.xml (single file; test names carry SRS ids)
#   artifact `hj20-firmware`  -> .elf / .bin / .map for the STM32G474RE
#   artifact `sbom-spdx`      -> SPDX 2.3 JSON (+ dependency-graph submission)
# Tags v* additionally publish a GitHub Release with the .bin, .elf and SBOM.
#
# Keep artifact names stable: the PLM picks the test report by name
# (/junit|test|results/i), so no other artifact may match that pattern.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-tests:
    name: Host build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure (host, -Werror)
        run: cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Debug -DHJ20_WERROR=ON

      - name: Build
        run: cmake --build build-host --parallel

      - name: Unit tests
        run: ctest --test-dir build-host --output-on-failure

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: build-host/test-results/junit.xml
          if-no-files-found: error
          retention-days: 90

  cross-build:
    name: Cross-compile STM32G474RE (arm-none-eabi-gcc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install GNU Arm toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi
          arm-none-eabi-gcc --version | head -n1

      - name: Configure
        run: >
          cmake -S . -B build-arm
          -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
          -DCMAKE_BUILD_TYPE=Release

      - name: Build firmware image
        run: cmake --build build-arm --parallel

      - name: Image size
        run: |
          OUT=build-arm/bsp/stm32g474
          arm-none-eabi-size --format=berkeley "$OUT/hj20-firmware.elf"
          {
            echo "### Firmware image"
            echo '```'
            arm-none-eabi-size --format=berkeley "$OUT/hj20-firmware.elf"
            echo '```'
            echo "bin: $(stat -c %s "$OUT/hj20-firmware.bin") bytes, sha256 $(sha256sum "$OUT/hj20-firmware.bin" | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware image
        uses: actions/upload-artifact@v4
        with:
          name: hj20-firmware
          path: |
            build-arm/bsp/stm32g474/hj20-firmware.elf
            build-arm/bsp/stm32g474/hj20-firmware.bin
            build-arm/bsp/stm32g474/hj20-firmware.map
          if-no-files-found: error
          retention-days: 90

  sbom:
    name: SBOM (SPDX 2.3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # dependency-graph snapshot submission
    steps:
      - uses: actions/checkout@v4

      - name: Generate SPDX document
        run: >
          python3 tools/gen_sbom.py
          --out build/sbom/hj20-firmware.spdx.json
          --snapshot build/sbom/dependency-snapshot.json
          --sha "${{ github.sha }}"
          --ref "${{ github.ref }}"
          --run-id "${{ github.run_id }}"
          --repo-url "${{ github.server_url }}/${{ github.repository }}"
          --toolchain "gcc-arm-none-eabi (Ubuntu package, ubuntu-latest)"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: build/sbom/hj20-firmware.spdx.json
          if-no-files-found: error
          retention-days: 90

      # Feeds GET /repos/{owner}/{repo}/dependency-graph/sbom. Needs the
      # dependency graph enabled on the repository; never fails the run.
      - name: Submit to dependency graph
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/dependency-graph/snapshots" \
            --data @build/sbom/dependency-snapshot.json)
          echo "dependency snapshot: HTTP $status"
          cat resp.json; echo
          test "$status" = "201"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, cross-build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hj20-firmware
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sbom-spdx
          path: dist

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v h="## [$VERSION]" '
            index($0, h) == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Firmware $GITHUB_REF_NAME" > notes.md; fi
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          mv hj20-firmware.bin "hj20-firmware-${GITHUB_REF_NAME}.bin"
          mv hj20-firmware.elf "hj20-firmware-${GITHUB_REF_NAME}.elf"
          sha256sum hj20-firmware-*.bin hj20-firmware-*.elf > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "HJ-20 firmware $GITHUB_REF_NAME" \
            --notes-file ../notes.md \
            --verify-tag \
            "hj20-firmware-${GITHUB_REF_NAME}.bin" \
            "hj20-firmware-${GITHUB_REF_NAME}.elf" \
            hj20-firmware.spdx.json \
            SHA256SUMS
